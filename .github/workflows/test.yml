name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, mbstring, xml, xmlwriter
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: composer install --no-interaction --prefer-dist --no-scripts --no-plugins
      - run: composer validate --strict
      - run: composer check-platform-reqs
      - run: php tests/contract.php
      - run: node scripts/run-transport.mjs
        env:
          FLOWSPEECH_TEST_PHP: php
          FLOWSPEECH_TEST_OPENSSL: openssl
          FLOWSPEECH_TEST_PHPUNIT: vendor/bin/phpunit
      - run: node scripts/build.mjs
      - run: node scripts/run-transport.mjs
        env:
          FLOWSPEECH_TEST_ROOT: ${{ github.workspace }}/dist/verify/flowspeech-php
          FLOWSPEECH_TEST_PHP: php
          FLOWSPEECH_TEST_OPENSSL: openssl
          FLOWSPEECH_TEST_PHPUNIT: vendor/bin/phpunit
